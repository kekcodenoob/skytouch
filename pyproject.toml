[build-system]
requires = ["scikit-build-core>=0.8.0", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "skytouch"
version = "0.1.0"
description = "Python and C++ project powered by pybind11"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.scikit-build]
build.verbose = true

[tool.scikit-build.wheel]
packages = ["src/skytouch"]

[tool.scikit-build.editable]
# Enables proper editable mode linkage for scikit-build-core
mode = "redirect"